# Override secrets for CI — production secret files don't exist on CI runners.
# Points all secrets to /dev/null so docker compose will start containers.
# The smoke test creates its own JWT secret file and passes it via JWT_SECRET_FILE.
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.ci.yml up

secrets:
  anthropic_api_key:
    file: /dev/null
  dockyard_database_master_key:
    file: /dev/null
  github_token:
    file: /dev/null
